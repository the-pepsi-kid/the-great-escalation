name: Publish illustrated alpha

on:
  push:
    branches: [main]
    paths: [.github/import-ready]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: illustrated-alpha-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-checks.txt
      - name: Verify game and delivered artifacts
        run: |
          node tests/engine.test.cjs
          python tests/artifact_checks.py
      - name: Verify checksums and prepare downloads
        run: python tools/package_release.py
      - name: Publish verified alpha downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TGE_TARGET: ${{ github.sha }}
          TGE_TAG: v0.1.0-illustrated.1
        run: |
          if gh release view "$TGE_TAG" --json isDraft > "$RUNNER_TEMP/tge-release-state.json"; then
            if python -c 'import json,sys;sys.exit(0 if not json.load(open(sys.argv[1]))["isDraft"] else 1)' "$RUNNER_TEMP/tge-release-state.json"; then
              echo 'The illustrated alpha release is already published.'
              exit 0
            fi
          else
            gh release create "$TGE_TAG" --target "$TGE_TARGET" --title '110-card illustrated alpha 0.1.0' --notes-file docs/RELEASE_NOTES.md --draft --prerelease
          fi
          gh release upload "$TGE_TAG" release/* --clobber
          gh release edit "$TGE_TAG" --draft=false --prerelease
