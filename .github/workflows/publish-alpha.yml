# Verified source checks. Large print PDFs and original PNG archives are
# GitHub Release assets, uploaded by Publish-The-Great-Escalation.ps1.
name: Verify illustrated alpha source

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'art/**'
      - '.github/workflows/publish-alpha.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'art/**'
      - '.github/workflows/publish-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify game rules engine
        run: node tests/engine.test.cjs
      - name: Verify card IDs and artwork coverage
        run: |
          python - <<'PY'
          import json, pathlib
          base = pathlib.Path('.')
          cards = json.loads((base / 'data/cards.json').read_text(encoding='utf-8'))['cards']
          assert len(cards) == 110, f"Expected 110 cards, found {len(cards)}"
          ids = [card['id'] for card in cards]
          assert len(ids) == len(set(ids)), 'Duplicate card IDs'
          for card_id in ids:
              assert (base / 'art' / (card_id + '.jpg')).exists(), f'Missing art for {card_id}'
              assert (base / 'art' / 'web' / (card_id + '.jpg')).exists(), f'Missing web art for {card_id}'
          assert (base / 'index.html').exists(), 'Missing browser game'
          print('110 cards, all matching master and web artwork, and game HTML verified.')
          PY
